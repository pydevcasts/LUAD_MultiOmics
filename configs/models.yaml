logistic_regression:
  enabled: true
  params:
    C:
      - 0.01
      - 0.1
      - 1.0
      - 10.0
    penalty:
      - l2
    solver:
      - lbfgs
    max_iter:
      - 2000
    class_weight:
      - balanced

random_forest:
  enabled: true
  params:
    n_estimators:
      - 200
      - 400
      - 800
    max_depth:
      - 3
      - 5
      - 10
      - null
    min_samples_split:
      - 2
      - 5
      - 10
    min_samples_leaf:
      - 1
      - 2
      - 4
    class_weight:
      - balanced
      - null
    random_state:
      - 42

svm:
  enabled: true
  params:
    C:
      - 0.1
      - 1.0
      - 10.0
    kernel:
      - rbf
      - linear
    gamma:
      - scale
      - auto
    probability:
      - true
    class_weight:
      - balanced

xgboost:
  enabled: true
  params:
    n_estimators:
      - 200
      - 400
      - 600
    max_depth:
      - 3
      - 5
      - 7
    learning_rate:
      - 0.01
      - 0.03
      - 0.05
      - 0.1
    subsample:
      - 0.7
      - 0.85
      - 1.0
    colsample_bytree:
      - 0.5
      - 0.75
      - 1.0
    min_child_weight:
      - 1
      - 3
      - 5
    gamma:
      - 0
      - 0.1
      - 0.3
    reg_lambda:
      - 0.0
      - 1.0
    reg_alpha:
      - 0.0
      - 0.1
    eval_metric:
      - "mlogloss"
    objective:
      - "multi:softprob"