task:
  name: multiclass_staging
  target: AJCC_PATHOLOGIC_TUMOR_STAGE
  target_type: multiclass

  target_preprocessing:
    strip: true
    uppercase: true
    grouped_target_column: STAGE_GROUP

    mapping:
      "STAGE IA": "STAGE I"
      "STAGE IB": "STAGE I"
      "STAGE I": "STAGE I"

      "STAGE IIA": "STAGE II"
      "STAGE IIB": "STAGE II"
      "STAGE II": "STAGE II"

      "STAGE IIIA": "STAGE III"
      "STAGE IIIB": "STAGE III"
      "STAGE IIIC": "STAGE III"
      "STAGE III": "STAGE III"

      "STAGE IV": "STAGE IV"
      "STAGE IVA": "STAGE IV"
      "STAGE IVB": "STAGE IV"

  allowed_classes:
    - "STAGE I"
    - "STAGE II"
    - "STAGE III"
    - "STAGE IV"

  drop_missing_target: true

clinical_data:
  patient_id_column: PATIENT_ID

  patient_id_candidates:
    - PATIENT_ID
    - OTHER_PATIENT_ID
    - SAMPLE_ID
    - TUMOR_SAMPLE_BARCODE

  leakage_drop_columns:
    - PATH_T_STAGE
    - PATH_N_STAGE
    - PATH_M_STAGE
    - AJCC_STAGING_EDITION
    - OS_STATUS
    - OS_MONTHS
    - DSS_STATUS
    - DSS_MONTHS
    - DFS_STATUS
    - DFS_MONTHS
    - PFS_STATUS
    - PFS_MONTHS
    - DAYS_LAST_FOLLOWUP
    - DAYS_TO_BIRTH
    - DAYS_TO_INITIAL_PATHOLOGIC_DIAGNOSIS
    - NEW_TUMOR_EVENT_AFTER_INITIAL_TREATMENT
    - PERSON_NEOPLASM_CANCER_STATUS
    - RADIATION_THERAPY
    - FORM_COMPLETION_DATE
    - IN_PANCANPATHWAYS_FREEZE
    - INFORMED_CONSENT_VERIFIED
    - SUBTYPE
    - CANCER_TYPE_ACRONYM
    - PRIMARY_LYMPH_NODE_PRESENTATION_ASSESSMENT
    - WEIGHT

  constant_or_low_value_drop_columns:
    - SUBTYPE
    - CANCER_TYPE_ACRONYM
    - DAYS_TO_INITIAL_PATHOLOGIC_DIAGNOSIS
    - INFORMED_CONSENT_VERIFIED
    - PRIMARY_LYMPH_NODE_PRESENTATION_ASSESSMENT
    - WEIGHT

harmonization:
  include_tumor_only: true
  scan_mutation_full: true
  mutation_preview_rows: 2000
  mutation_chunksize: 100000

mutation_data:
  sample_column: Tumor_Sample_Barcode
  gene_column: Hugo_Symbol
  variant_classification_column: Variant_Classification
  include_matched_normal: false
  exclude_variant_classifications:
    - Silent

data_preparation:
  chunksize: 5000
  mutation_chunksize: 100000

  prepare_keys:
    - clinical
    - mrna_rsem
    - mirna
    - methylation
    - cna_raw
    - rppa_raw
    - rppa_zscores
    - mutations

  feature_schemas:
    mrna_rsem:
      feature_id_column: Hugo_Symbol
      feature_id_fallback_column: Entrez_Gene_Id
      feature_metadata_columns:
        - Entrez_Gene_Id
      feature_prefix: mrna
      output_orientation: patient_by_feature

    mirna:
      feature_id_column: miRNA_ID
      feature_metadata_columns: []
      feature_prefix: mirna
      output_orientation: patient_by_feature

    methylation:
      feature_id_column: ENTITY_STABLE_ID
      feature_name_column: NAME
      feature_metadata_columns:
        - NAME
        - DESCRIPTION
        - TRANSCRIPT_ID
      feature_prefix: meth
      output_orientation: feature_by_patient

    cna_raw:
      feature_id_column: Hugo_Symbol
      feature_id_fallback_column: Entrez_Gene_Id
      feature_metadata_columns:
        - Entrez_Gene_Id
      feature_prefix: cna_raw
      output_orientation: patient_by_feature

    rppa_raw:
      feature_id_column: Composite.Element.REF
      feature_metadata_columns: []
      feature_prefix: rppa_raw
      output_orientation: patient_by_feature

    rppa_zscores:
      feature_id_column: Composite.Element.REF
      feature_metadata_columns: []
      feature_prefix: rppa_zscore
      output_orientation: patient_by_feature

cohort:
  primary: core_mutation
  target_column: stage_group

  definitions:
    stage_only: []

    mrna_only:
      - has_mrna_rsem

    clinical_mrna:
      - has_mrna_rsem

    mrna_mirna:
      - has_mrna_rsem
      - has_mirna

    mrna_mirna_methylation:
      - has_mrna_rsem
      - has_mirna
      - has_methylation

    core_omics:
      - has_mrna_rsem
      - has_mirna
      - has_methylation
      - has_cna_raw

    core_mutation:
      - has_mrna_rsem
      - has_mirna
      - has_methylation
      - has_cna_raw
      - has_mutations

    core_rppa:
      - has_mrna_rsem
      - has_mirna
      - has_methylation
      - has_cna_raw
      - has_rppa_zscores

    all_main:
      - has_mrna_rsem
      - has_mirna
      - has_methylation
      - has_cna_raw
      - has_rppa_zscores
      - has_mutations
    
baseline:
  cv_folds: 5
  max_missing_ratio: 0.2
  top_variance_features: 1000
  feature_selection_method: anova
  random_state: 42

  log1p_modalities:
    - mrna_rsem
    - mirna

  models:
    - logistic_regression
    - random_forest
    - svm
    - xgboost

late_fusion:
  base_model: random_forest
  meta_learner: logistic_regression
  cv_folds: 5
  max_missing_ratio: 0.2
  top_features: 500
  feature_selection_method: anova
  random_state: 42